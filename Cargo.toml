[package]
name = "ppocr-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "(MIT OR Apache-2.0) AND BSD-3-Clause AND Apache-2.0 AND BSL-1.0"
authors = ["Bruno Gonçalves <www.biglinux.com.br>"]
description = "PP-OCRv6 text detection and recognition in plain Rust: the networks and the image work around them, reproducing RapidOCR"
repository = "https://github.com/biglinux/ppocr-native"
homepage = "https://www.biglinux.com.br"
publish = false

[dependencies]

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
