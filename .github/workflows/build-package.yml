name: Build Package

on:
  workflow_dispatch:
  # Only new branches with "testing" or "stable" in the name build a package;
  # `create` has no branch filter, hence the condition below.
  create:

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.ref_type == 'branch' &&
      (contains(github.ref_name, 'testing') || contains(github.ref_name, 'stable')))
    runs-on: ubuntu-latest
    steps:
      - name: Send Hooks BigLinux Build Package
        shell: bash
        run: |
          payload='{"event_type": "${{ github.repository }}", "client_payload": { "branch": "${{ github.ref_name }}", "url": "https://github.com/${{ github.repository }}"}}'
          curl --fail-with-body -X POST -H "Accept: application/json" -H "Authorization: token ${{ secrets.WEBHOOK_TOKEN }}" \
            --data "$payload" https://api.github.com/repos/BigLinux-Package-Build/build-package/dispatches
